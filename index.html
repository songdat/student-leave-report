
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แจ้งการลานักศึกษา ปวช.2/2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Tahoma, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 15px;
  color: #1e293b;
}

.container {
  max-width: 750px;
  margin: auto;
}

.header {
  background: #2563eb;
  color: white;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

.header h2 {
  margin: 0 0 5px;
}

.card {
  background: white;
  margin-top: 15px;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #0000000d;
}

.student {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 13px 5px;
  border-bottom: 1px solid #e2e8f0;
}

.student:last-child {
  border-bottom: none;
}

.student-name {
  flex: 1;
  font-size: 15px;
  font-weight: bold;
}

.options {
  display: flex;
  align-items: center;
  gap: 12px;
}

.check-option {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  white-space: nowrap;
  cursor: pointer;
}

.check-option input {
  width: 18px;
  height: 18px;
  cursor: pointer;
}

.check-option.sick {
  color: #2563eb;
}

.check-option.personal {
  color: #d97706;
}

textarea {
  width: 100%;
  min-height: 250px;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-family: Tahoma, sans-serif;
  font-size: 15px;
  line-height: 1.8;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  margin-top: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.copy {
  background: #16a34a;
  color: white;
}

.reset {
  background: #e2e8f0;
  color: #334155;
}

#status {
  text-align: center;
  color: #15803d;
  margin-top: 10px;
  font-size: 14px;
}

@media(max-width:480px) {
  body {
    padding: 9px;
  }

  .card {
    padding: 12px;
  }

  .student {
    gap: 5px;
  }

  .student-name {
    font-size: 12px;
  }

  .options {
    gap: 7px;
  }

  .check-option {
    font-size: 12px;
    gap: 2px;
  }

  .check-option input {
    width: 16px;
    height: 16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>ระบบแจ้งการลานักศึกษา</h2>
    <div>ระดับ ปวช.2/2</div>
  </div>

  <div class="card">

    <h3>เลือกรายชื่อนักศึกษาที่ลา</h3>

    <div id="studentList"></div>

  </div>

  <div class="card">

    <h3>ข้อความสำหรับส่ง LINE</h3>

    <textarea id="message" spellcheck="false"></textarea>

    <button class="copy" onclick="copyMessage()">
      คัดลอกข้อความ
    </button>

    <button class="reset" onclick="resetAll()">
      ล้างรายการที่เลือก
    </button>

    <div id="status"></div>

  </div>

</div>

<script>

// ==================================
// รายชื่อนักศึกษา
// ==================================

const students = [
  "นางสาวนิรากร ผิวพรรณ์",
  "นางสาวพรนภา นิวงษา",
  "นางสาวประภัสสร ชนะพจน์",
  "นางสาวเกสรา พิมสลัด",
  "นางสาวกานต์มณี ศรีเพ็ชร",
  "นางสาวอรจิรา พานิม",
  "นางสาวพาณิภัค จิตงาม",
  "นายภูมิใจ ชนะพจน์",
  "นายณัฐดนัย เฟื้อย",
  "นายบุรัสกร เสนาสี",
  "นายพรมมินย์ เอกพันธ์",
  "นายธัชนนท์ ศิริสวัสดิ์",
  "นายจักรดุลย์ วะตะมะ",
  "นายพีท กองวงค์",
  "นายอิทธิกร บุตรม่วง",
  "นายธนากร ยังใจ",
  "นางสาวบุญญลักษณ์ ฤกษ์รูจี",
  "นางสาวสุพรรษา ผิวนวล",
  "นางสาวโศรญา เหล่ามาลา",
  "นางสาวอรวรรณ เปคำผุย",
  "นางสาวพิมพ์พิสุทธิ์ ประชาโรจน์",
  "นางสาวศุภานัน พิมละออ",
  "นายญาณกวียชญ์ ยะวงษ์ศรี",
  "นางสาวนฤมล ชนะดิษฐ์",
  "นางสาวชนันญา พันธุ์เมือง",
  "นางสาวชไมพร ชมภูพระ",
  "นายนราธิป ไชยสุระ",
  "นายธีรศักดิ์ ทองสิงห์"
];

// ==================================
// สร้างรายชื่อนักศึกษา
// ==================================

function createStudents() {

  const list = document.getElementById("studentList");

  students.forEach(function(name, index) {

    const row = document.createElement("div");
    row.className = "student";

    const studentName = document.createElement("div");
    studentName.className = "student-name";
    studentName.textContent = (index + 1) + ". " + name;

    const options = document.createElement("div");
    options.className = "options";

    // Checkbox ลาป่วย
    const sickLabel = document.createElement("label");
    sickLabel.className = "check-option sick";

    const sick = document.createElement("input");
    sick.type = "checkbox";
    sick.value = "ลาป่วย";
    sick.dataset.index = index;

    sick.addEventListener("change", function() {

      if (sick.checked) {
        personal.checked = false;
      }

      createMessage();

    });

    sickLabel.appendChild(sick);
    sickLabel.appendChild(document.createTextNode("ลาป่วย"));

    // Checkbox ลากิจ
    const personalLabel = document.createElement("label");
    personalLabel.className = "check-option personal";

    const personal = document.createElement("input");
    personal.type = "checkbox";
    personal.value = "ลากิจ";
    personal.dataset.index = index;

    personal.addEventListener("change", function() {

      if (personal.checked) {
        sick.checked = false;
      }

      createMessage();

    });

    personalLabel.appendChild(personal);
    personalLabel.appendChild(document.createTextNode("ลากิจ"));

    options.appendChild(sickLabel);
    options.appendChild(personalLabel);

    row.appendChild(studentName);
    row.appendChild(options);

    list.appendChild(row);

  });

  createMessage();

}

// ==================================
// สร้างข้อความอัตโนมัติ
// ==================================

function createMessage() {

  let message = "";

  message += "ขออนุญาตแจ้งครูผู้สอน\n";
  message += "นักศึกษาระดับ ปวช.2/2 แจ้งลา\n\n";

  const rows = document.querySelectorAll(".student");

  let count = 0;

  rows.forEach(function(row, index) {

    const checkboxes = row.querySelectorAll(
      'input[type="checkbox"]'
    );

    checkboxes.forEach(function(checkbox) {

      if (checkbox.checked) {

        count++;

        message += count + ". " +
          students[index] + " " +
          checkbox.value + "\n";

      }

    });

  });

  message += "\nขอบคุณครับ";

  document.getElementById("message").value = message;

}

// ==================================
// คัดลอกข้อความ
// ==================================

async function copyMessage() {

  const textarea = document.getElementById("message");
  const status = document.getElementById("status");

  try {

    await navigator.clipboard.writeText(textarea.value);

    status.textContent =
      "คัดลอกข้อความเรียบร้อยแล้ว นำไปวางใน LINE ได้เลย";

  } catch (error) {

    textarea.focus();
    textarea.select();

    const copied = document.execCommand("copy");

    status.textContent = copied
      ? "คัดลอกข้อความเรียบร้อยแล้ว"
      : "กรุณากดค้างที่ข้อความเพื่อคัดลอก";

  }

}

// ==================================
// ล้างรายการทั้งหมด
// ==================================

function resetAll() {

  const checkboxes = document.querySelectorAll(
    '#studentList input[type="checkbox"]'
  );

  checkboxes.forEach(function(checkbox) {
    checkbox.checked = false;
  });

  document.getElementById("status").textContent = "";

  createMessage();

}

// เริ่มต้นเว็บไซต์
createStudents();

</script>

</body>
</html>
